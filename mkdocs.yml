site_name: ESPHome for Mere Mortals
site_description: Plain-language firmware for ESP32 and ESP8266 boards, written as one YAML file. Sensors and switches, Wi-Fi and secrets, over-the-air updates, the native API and Home Assistant, and an honest account of what a bench with no hardware could prove.
site_url: https://paulsullivan33-dev.github.io/esphome-for-mere-mortals/
