# The Greenhouse Node - a fictional sensor node for an invented
# backyard greenhouse. It watches the air with a BME280, notices
# the door with a reed switch, and runs a small vent fan on a relay.
esphome:
  name: greenhouse
  friendly_name: Greenhouse

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Greenhouse Fallback"
    password: !secret ota_password

captive_portal:

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  - platform: bme280_i2c
    address: 0x76
    temperature:
      name: "Greenhouse Temperature"
      id: air_temp
      oversampling: 2x
    pressure:
      name: "Greenhouse Pressure"
    humidity:
      name: "Greenhouse Humidity"
    update_interval: 60s
  - platform: uptime
    name: "Greenhouse Uptime"
  - platform: wifi_signal
    name: "Greenhouse Wi-Fi Signal"
    update_interval: 60s

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Greenhouse Door"
    device_class: door

switch:
  - platform: gpio
    pin: GPIO19
    name: "Vent Fan"
    id: vent_fan
    restore_mode: RESTORE_DEFAULT_OFF

interval:
  - interval: 30s
    then:
      - if:
          condition:
            sensor.in_range:
              id: air_temp
              above: 30.0
          then:
            - switch.turn_on: vent_fan
          else:
            - switch.turn_off: vent_fan
